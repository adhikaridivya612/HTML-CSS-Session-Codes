<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Detail</title>
</head>

<body>
    <h1>Student Registration</h1>
    <form>
        <label>Name</label>
        <input type="text" placeholder="Enter Your Name">
        <br>
        <label>Email</label>
        <input type="email" placeholder="Enter Your Email">
        <br>
        <label>Password</label>
        <input type="password" placeholder="Enter Your Password">
        <br>
        <label>Phone number</label>
        <input type="tel" placeholder="Enter Your Phone Number">
        <br>
        <label>Date Of Birth</label>
        <input type="date">
        <br>
        <label>Feedback/Messeage</label>
        <br>
        <textarea placeholder="Enter Messeage/Feedback" rows="16" cols="100"></textarea>
        <input type="radio" value="A" name="answer" id="102">A
        <br>
        <!-- checkbox -->
        <p>
            <label>Hobby</label>
            <br>
            <br>
            <input type="checkbox" value="Football">Football
            <br>
            <input type="checkbox" value="Writing">Writing
            <br>
            <input type="checkbox" value="Singing">Singing
            <br>
            <input type="checkbox" value="Travelling">Travelling
            <br>
            <br>
            <label id="102">Gender</label>
        </p>
        <input type="radio" value="male" name="gender" id="102">male
        <br>
        <input type="radio" value="female" name="gender" id="102">female
        <br>
        <input type="radio" value="custom" name="answer" id="102">custom
        <br>
        <br>
        <!-- button -->
        <button>Login</button>
        <button>Register</button>
        <button>Click Me</button>
        <br>
        <br>
        <!-- Drop Down -->
        <label>Select cource </label>
        <br>
        <br>
        <select name="courses">
            <option value="0" disabled selected>Select Course</option>
            <option value="csit">CSIT</option>
            <option value="bca">BCA</option>
            <option value="bit">BIT</option>
            <option value="bba">BBA</option>
            <option value="ca">CA</option>

        </select>
    </form>
</body>

</html>
