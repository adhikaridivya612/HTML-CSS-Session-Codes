<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>

<body>
    <h1> Registration Form</h1>
    <form>
        <label>Name</label>
        <input type="text" placeholder="Enter Your Name">
        <br>
        <label>Password</label>
        <input type="password" placeholder="Enter Your Password">
        <br>
        <label>Address</label>
        <input type="text" placeholder="Enter your address">
        <br>
        <label>Date Of Birth</label>
        <input type="date">
        <br>
        <label id="102">Gender</label>
        <br>
        <input type="radio" value="male" name="gender" id="102">male
        <br>
        <input type="radio" value="female" name="gender" id="102">female
        <br>
        <input type="radio" value="custom" name="answer" id="102">custom
        <br>
        <br>
        <br>
        <label>Hobbies</label>
        <br>
        <br>
        <input type="checkbox" value="Acting">Acting
        <br>
        <input type="checkbox" value="Writing">Writing
        <br>
        <input type="checkbox" value="Travelling">Travelling
        <br>
        <br>
        <label>Messeage</label>
        <br>
        <textarea placeholder="Enter Messeage" rows="16" cols="100"></textarea>
        <br>
        <br>
        <button>Registration Button</button>
    </form>
</body>

</html>
