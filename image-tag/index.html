<!DOCTYPE html>

<head>
    <title>example of image tag</title>
</head>

<body>
    <!-- Online approach -->
    <a href="https://www.google.com" target="_blankl"></a>
    <img src="https://i.pinimg.com/736x/63/7a/17/637a179d5287534db5b08970975bf4bb.jpg" height="300" alt="panda image" />
    <br>
    <!-- Offline approach -->

    <img src="./assets/swannnn.jpg" alt="swan image" height="300">
    <p>original proce:</p><del>500</del>
    <p>new price: 350</p>
    <!-- inserting video using online approach -->
    <video width="550" controls>
        <source src="https://youtu.be/iwncGYFPxmU?list=RDiwncGYFPxmU" type="video/mp4">
    </video>
    <!-- inserting video using offline approach -->

    <br>

    <video width="550" controls>
        <source src="./assets/video.mp4" type="video/mp4">
    </video>

    <!-- Delete tag-->
    <p>Orignal price:
        <del>5000</del>
    </p>
    <p>New price:
        3000
    </p>
    <p>price</p><del>500</del>

    <br>
    <!-- iframe -->
    <br>
    <iframe src="https://www.youtube.com/embed/v9QtM6qnG50?t=5" frameborder="0" height="500" width="800"></iframe>

</body>

</html>
